// Launch options: `-console -nojoy -novid +exec autoexec`


// ---------------------------------- Aliases ----------------------------------

// Jump and throw grenade.
alias "+jumpthrow" "+jump; -attack"
alias "-jumpthrow" "-jump"

// Show scoreboard and network graph.
alias "+ng" "+showscores; net_graph 1"
alias "-ng" "-showscores; net_graph 0"


// --------------------------------- Bindings ----------------------------------

// Keyboard:
bind "ALT" "+jumpthrow"
bind "TAB" "+ng"
bind "Z" "+radialradio"
bind "C" "+voicerecord"

// Mouse:
bind "MWHEELDOWN" "+jump"
bind "MOUSE4" "use weapon_flashbang"
bind "MOUSE5" "use weapon_smokegrenade"


// --------------------------------- Crosshair ---------------------------------

cl_crosshair_drawoutline 0;
cl_crosshairalpha 255;
cl_crosshaircolor 1;
cl_crosshairdot 0;
cl_crosshairgap -3;
cl_crosshairsize 2;
cl_crosshairstyle 4;
cl_crosshairthickness 0.5;
cl_crosshairusealpha 1;


// ------------------------------ Weapon position ------------------------------

cl_righthand 0
viewmodel_fov 65
viewmodel_offset_x 2
viewmodel_offset_y 2
viewmodel_offset_z -2
viewmodel_presetpos 0


// ---------------------------- Reduce weapon sway -----------------------------

cl_bob_lower_amt 5
cl_bobamt_lat 0.1
cl_bobamt_vert 0.1
cl_bobcycle 0.98
cl_viewmodel_shift_left_amt 0.5
cl_viewmodel_shift_right_amt 0.25


// ----------------------------------- Mouse -----------------------------------

// Remove acceleration.
m_customaccel 0
m_customaccel_exponent 0
m_customaccel_scale 0
m_mouseaccel1 0
m_mouseaccel2 0
m_mousespeed 0
m_rawinput 1

sensitivity 1.5  // 800 DPI.


// ------------------------------------ HUD ------------------------------------

cl_hud_color 1
cl_hud_playercount_showcount 1
hud_scaling 0.81
safezonex 0.67
safezoney 1


// ----------------------------------- Radar -----------------------------------

cl_radar_always_centered 0
cl_radar_scale 0.5


// ----------------------------------- Video -----------------------------------

fps_max 144
fps_max_menu 60
mat_queue_mode 2
mat_monitorgamma 2.1


// ---------------------------------- Volume -----------------------------------

snd_deathcamera_volume 0.0
snd_mapobjective_volume 0.0
snd_menumusic_volume 0.0
snd_mvp_volume 0.0
snd_roundend_volume 0.2
snd_roundstart_volume 0.0
snd_tensecondwarning_volume 0.2
voice_mixer_volume 1
voice_scale 0.8


// ----------------------------------- Misc ------------------------------------

cl_autowepswitch 0
cl_show_observer_crosshair 2


// ---------------------------------- Social -----------------------------------

cl_join_advertise 2  // Allow friends to join without invitation.


// -------------------------------- Matchmaking --------------------------------

cl_color 4  // Preferred player color.
mm_dedicated_search_maxping 100


// ----------------------------- Community servers -----------------------------

cl_disablehtmlmotd 1
cl_downloadfilter "mapsonly"
player_nevershow_communityservermessage 1


// ----------------------------- Disable tutorial ------------------------------

cl_autohelp 0
cl_showhelp 0
gameinstructor_enable 0


// ----------------------------- Disable kill cam ------------------------------

cl_disablefreezecam 1
spec_replay_autostart 0


// ------------------------------- Apply changes -------------------------------

echo "--- Succesfully executed autoexec.cfg ---"
host_writeconfig
